      // --- State Variablen ---
      let currentMode = '';
      let activeQuestions = [];
      let mistakes = []; // Speichert falsche Antworten
      let currentIndex = 0;
      let score = 0;
      let autoAdvanceEnabled = true;
      let advanceTimer = null;
      const questionsPerRound = 10;
      const container = document.getElementById('quizContainer');

      if (!container) return;

      // --- View 1: Setup / Startbildschirm ---
      function renderSetup() {
        container.innerHTML = `
          <div class="setup-view">
            <h2>Wähle deinen Spielmodus</h2>
            <div class="setup-grid">
              <button id="btnStartClassic" class="mode-btn">
                <span>Klassisch</span>
                <small>Wähle die richtige Übersetzung (Multiple Choice)</small>
              </button>
              <button id="btnStartTF" class="mode-btn">
                <span>Verdadero o Falso</span>
                <small>Passen Satz und Übersetzung zusammen?</small>
              </button>
            </div>
            <label class="toggle-wrap">
              <input type="checkbox" id="autoAdvanceToggle" checked>
              Nach Antwort automatisch weiter
            </label>
          </div>
        `;
        
        // Event Listener direkt anhängen
        document.getElementById('btnStartClassic').addEventListener('click', () => startQuiz('classic'));
        document.getElementById('btnStartTF').addEventListener('click', () => startQuiz('tf'));
      }

      // --- Quiz Generator & Start ---
      function startQuiz(mode) {
        currentMode = mode;
        autoAdvanceEnabled = document.getElementById('autoAdvanceToggle') ? document.getElementById('autoAdvanceToggle').checked : true;
        currentIndex = 0;
        score = 0;
        mistakes = []; // Fehler-Speicher für neue Runde leeren
        
        const shuffledVocab = [...vocabDB].sort(() => 0.5 - Math.random());
        const roundVocab = shuffledVocab.slice(0, questionsPerRound);
        
        activeQuestions = roundVocab.map(item => {
          if (mode === 'classic') {
            const wrongOptions = vocabDB.filter(v => v.de !== item.de).sort(() => 0.5 - Math.random()).slice(0, 2);
            const options = [item.de, wrongOptions[0].de, wrongOptions[1].de].sort(() => 0.5 - Math.random());
            return { q: item.es, correct: item.de, options: options, type: 'classic', originalData: item };
          } else {
            const isTrue = Math.random() > 0.5;
            let displayDe = item.de;
            if (!isTrue) {
               const wrongVocab = vocabDB.filter(v => v.de !== item.de).sort(() => 0.5 - Math.random())[0];
               displayDe = wrongVocab.de;
            }
            return { q: item.es, statementDe: displayDe, correct: isTrue ? 'Verdadero (Wahr)' : 'Falso (Falsch)', options: ['Verdadero (Wahr)', 'Falso (Falsch)'], type: 'tf', originalData: item };
          }
        });

        renderQuestion();
      }

      function startMistakesQuiz() {
        activeQuestions = [...mistakes]; // Nur die Fehler nehmen
        mistakes = []; // Speicher leeren (falls man sie WIEDER falsch macht)
        currentIndex = 0;
        score = 0;
        renderQuestion();
      }

      // --- View 2: Die aktive Frage ---
      function renderQuestion() {
        clearTimeout(advanceTimer); 
        const item = activeQuestions[currentIndex];
        
        let questionHTML = `<div class="quiz-question-text">${item.q}</div>`;
        let gridClass = "quiz-options";

        if (item.type === 'tf') {
          questionHTML += `<div class="tf-statement">Bedeutet: <strong>„${item.statementDe}“</strong></div>`;
          gridClass = "quiz-options tf-options";
        }

        container.innerHTML = `
          <div class="quiz-header">
            <span class="eyebrow" style="margin:0; background: var(--color-surface-3); color: var(--color-text)">Frage ${currentIndex + 1} von ${activeQuestions.length}</span>
            <span class="quiz-progress">Punkte: ${score}</span>
          </div>
          ${questionHTML}
          <div class="${gridClass}" id="optionsContainer"></div>
          <div class="quiz-footer">
            <div id="feedbackText" class="quiz-feedback"></div>
            <button id="nextBtn" class="btn-primary" style="display:none;">Nächste Frage</button>
          </div>
        `;

        const optionsContainer = document.getElementById('optionsContainer');
        const nextBtn = document.getElementById('nextBtn');
        const feedbackText = document.getElementById('feedbackText');

        item.options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'quiz-option';
          btn.textContent = option;
          
          btn.addEventListener('click', () => {
            const allBtns = optionsContainer.querySelectorAll('.quiz-option');
            allBtns.forEach(b => b.disabled = true);
            nextBtn.style.display = 'block';

            if (option === item.correct) {
              btn.classList.add('correct');
              feedbackText.textContent = '¡Correcto!';
              feedbackText.className = 'quiz-feedback feedback-correct';
              score++;
              document.querySelector('.quiz-progress').textContent = `Punkte: ${score}`;
            } else {
              btn.classList.add('wrong');
              feedbackText.textContent = '¡Falso!';
              feedbackText.className = 'quiz-feedback feedback-wrong';
              
              // Falsche Antwort in die Fehler-Liste eintragen
              mistakes.push(item);

              allBtns.forEach(b => {
                if(b.textContent === item.correct) b.classList.add('correct');
              });
            }

            if (autoAdvanceEnabled) {
              advanceTimer = setTimeout(goToNext, 1600);
            }
          });
          optionsContainer.appendChild(btn);
        });

        nextBtn.addEventListener('click', () => {
          clearTimeout(advanceTimer);
          goToNext();
        });
      }

      function goToNext() {
        currentIndex++;
        if (currentIndex < activeQuestions.length) {
          renderQuestion();
        } else {
          showResults();
        }
      }

      // --- View 3: Ergebnis ---
      function showResults() {
        let message = "";
        if(score === activeQuestions.length) message = "¡Excelente! Perfekt, alles richtig!";
        else if(score >= activeQuestions.length * 0.7) message = "¡Muy bien! Das sieht schon sehr gut aus.";
        else message = "¡Sigue practicando! Übung macht den Meister.";

        let retryBtnHTML = '';
        if (mistakes.length > 0) {
            retryBtnHTML = `<button id="btnRetry" class="btn-primary" style="background: var(--color-accent); border-color: var(--color-accent);">Fehler wiederholen (${mistakes.length})</button>`;
        }

        container.innerHTML = `
          <div class="result-view">
            <h2>Runde beendet!</h2>
            <div class="score-circle">${score} / ${activeQuestions.length}</div>
            <p style="margin-bottom: var(--space-6); color: var(--color-text-muted);">${message}</p>
            <div style="display:flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap;">
              <button id="btnRestart" class="btn-primary">Neue Runde spielen</button>
              ${retryBtnHTML}
              <button id="btnSetup" class="btn-primary" style="background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border);">Modus wechseln</button>
            </div>
          </div>
        `;

        // Event Listener direkt nach dem Einfügen anhängen
        document.getElementById('btnRestart').addEventListener('click', () => startQuiz(currentMode));
        document.getElementById('btnSetup').addEventListener('click', renderSetup);
        
        if (mistakes.length > 0) {
            document.getElementById('btnRetry').addEventListener('click', startMistakesQuiz);
        }
      }

      // Starte App
      renderSetup();
    });
  </script>
</body>
</html>
